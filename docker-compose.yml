# ABC Bank AI Assistant - all services share ./libs (root build context). docs/10, docs/13
# Quick start:  cp .env.example .env  &&  docker compose up --build
# Real Keycloak auth is on by default (AUTH_MODE=keycloak); the abc-bank realm is auto-imported.
#   Staff login (admin console + staff chat): admin / Admin#12345 , analyst / Analyst#12345
#   Public chat: "Continue with SSO" (needs SSO_* broker creds; otherwise use staff sign-in).
name: ai-assistant
services:
  ui-public:
    build: { context: ., dockerfile: services/ui-public/Dockerfile }
    ports: ["8501:8501"]
    env_file: .env
    environment:
      - API_URL=http://ai-assistant-api:8000
      - AUTH_MODE=keycloak
      - KEYCLOAK_URL=http://host.docker.internal:8080
      - KEYCLOAK_REALM=abc-bank
      - KEYCLOAK_WEB_CLIENT_ID=ai-assistant-web
      - KEYCLOAK_ADMIN_CLIENT_ID=ai-assistant-admin
      # Empty = SSO uses Keycloak's own login (grants Viewer). Set to a CONFIGURED broker alias
      # (e.g. corporate-sso) only after filling real IdP creds in the realm — see docs/16.
      - KEYCLOAK_SSO_IDP=
      - PUBLIC_BASE_URL=http://localhost:8501
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      ai-assistant-api: { condition: service_started }
      keycloak: { condition: service_healthy }
  ui-admin:
    build: { context: ., dockerfile: services/ui-admin/Dockerfile }
    ports: ["8502:8502"]
    env_file: .env
    environment:
      - ADMIN_URL=http://ai-admin-service:8800
      - AUTH_MODE=keycloak
      - KEYCLOAK_URL=http://host.docker.internal:8080
      - KEYCLOAK_REALM=abc-bank
      - KEYCLOAK_ADMIN_CLIENT_ID=ai-assistant-admin
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      ai-admin-service: { condition: service_started }
      keycloak: { condition: service_healthy }
  ai-assistant-api:
    build: { context: ., dockerfile: services/ai-assistant-api/Dockerfile }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      - AUTH_MODE=keycloak
      - KEYCLOAK_URL=http://host.docker.internal:8080
      - KEYCLOAK_REALM=abc-bank
      - KEYCLOAK_CLIENT_ID=ai-assistant-web
      - INGEST_ON_START=true
      - SAMPLE_DOCS=/corpus
      - LLM_CONFIG_PATH=/runtime/llm_config.json
      - INDEX_PATH=/kb/index.json
      # true service-to-service: delegate the agent run to the orchestrator over HTTP
      - ORCHESTRATOR_URL=http://ai-orchestrator:8100
    volumes:
      - "./services/ai-knowledge-service/ingestion/sample_docs:/corpus:ro"
      - "llmcfg:/runtime"
      - "kbindex:/kb"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      ai-orchestrator: { condition: service_started }
      ai-conversation-service: { condition: service_started }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
  ai-orchestrator:
    build: { context: ., dockerfile: services/ai-orchestrator/Dockerfile }
    expose: ["8100"]
    env_file: .env
    environment:
      - LLM_CONFIG_PATH=/runtime/llm_config.json
      - INDEX_PATH=/kb/index.json
      # true service-to-service: orchestrator calls the leaf services over HTTP
      - KNOWLEDGE_RETRIEVAL_URL=http://ai-knowledge-retrieval:8200
      - TOOL_SERVICE_URL=http://ai-tool-service:8300
      - MODEL_GATEWAY_URL=http://ai-model-gateway:8700
      - CONVERSATION_URL=http://ai-conversation-service:8600
    volumes:
      - "llmcfg:/runtime"
      - "kbindex:/kb"
    depends_on: [ai-knowledge-retrieval, ai-tool-service, ai-conversation-service, ai-model-gateway]
  ai-knowledge-retrieval:
    build: { context: ., dockerfile: services/ai-knowledge-service/retrieval/Dockerfile }
    expose: ["8200"]
    env_file: .env
    environment:
      - INDEX_PATH=/kb/index.json
      - KNOWLEDGE_RETRIEVAL_URL=   # leaf service: must not call itself
    volumes: ["kbindex:/kb"]
  ai-knowledge-ingest:
    build: { context: ., dockerfile: services/ai-knowledge-service/ingestion/Dockerfile }
    expose: ["8400"]
    env_file: .env
    environment: ["INDEX_PATH=/kb/index.json"]
    volumes: ["kbindex:/kb"]
    depends_on:
      postgres: { condition: service_healthy }
  ai-tool-service:
    build: { context: ., dockerfile: services/ai-tool-service/Dockerfile }
    expose: ["8300"]
    env_file: .env
    environment:
      - TOOL_SERVICE_URL=       # leaf service: must not call itself
  ai-conversation-service:
    build: { context: ., dockerfile: services/ai-conversation-service/Dockerfile }
    expose: ["8600"]
    env_file: .env
    environment:
      - CONVERSATION_URL=       # leaf service: must not call itself
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
  ai-model-gateway:
    build: { context: ., dockerfile: services/ai-model-gateway/Dockerfile }
    expose: ["8700"]
    env_file: .env
    environment:
      - LLM_CONFIG_PATH=/runtime/llm_config.json
      - MODEL_GATEWAY_URL=      # leaf service: completes locally, never calls itself
    volumes: ["llmcfg:/runtime"]
    depends_on:
      redis: { condition: service_healthy }
  ai-admin-service:
    build: { context: ., dockerfile: services/ai-admin-service/Dockerfile }
    ports: ["8800:8800"]
    env_file: .env
    environment:
      - AUTH_MODE=keycloak
      - KEYCLOAK_URL=http://host.docker.internal:8080
      - KEYCLOAK_REALM=abc-bank
      - KEYCLOAK_CLIENT_ID=ai-assistant-admin
      - LLM_CONFIG_PATH=/runtime/llm_config.json
      - INDEX_PATH=/kb/index.json
    volumes:
      - "llmcfg:/runtime"
      - "kbindex:/kb"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      ai-knowledge-ingest: { condition: service_started }
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    ports: ["8080:8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Stable issuer shared by browser (SSO redirect) and containers (token/JWKS) — see README.
      KC_HOSTNAME_URL: http://host.docker.internal:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - "./infra/keycloak:/opt/keycloak/data/import:ro"
    healthcheck:
      # HTTP/1.1 with a Host header — Keycloak's hostname-v2 provider NPEs on a missing authority.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/abc-bank HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q abc-bank"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  redis:
    image: redis:7
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    expose: ["5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  llmcfg:
  kbindex:
