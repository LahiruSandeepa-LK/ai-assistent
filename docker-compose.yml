# ABC Bank AI Assistant - all services share ./libs (root build context). docs/10, docs/13
# Quick start:  cp .env.example .env  &&  docker compose up --build
# Real Keycloak auth is on by default (AUTH_MODE=keycloak); the abc-bank realm is auto-imported.
#   Staff login (admin console + staff chat): admin / Admin#12345 , analyst / Analyst#12345
#   Public chat: "Continue with SSO" (needs SSO_* broker creds; otherwise use staff sign-in).
name: ai-assistant
services:
  ui-public:
    build: { context: ., dockerfile: services/ui-public/Dockerfile }
    ports: ["8501:8501"]
    env_file: .env
    environment:
      - API_URL=http://ai-assistant-api:8000
      - AUTH_MODE=keycloak
      - KEYCLOAK_URL=http://host.docker.internal:8080
      - KEYCLOAK_REALM=abc-bank
      - KEYCLOAK_WEB_CLIENT_ID=ai-assistant-web
      - KEYCLOAK_ADMIN_CLIENT_ID=ai-assistant-admin
      - KEYCLOAK_SSO_IDP=corporate-sso
      - PUBLIC_BASE_URL=http://localhost:8501
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [ai-assistant-api, keycloak]
  ui-admin:
    build: { context: ., dockerfile: services/ui-admin/Dockerfile }
    ports: ["8502:8502"]
    env_file: .env
    environment:
      - ADMIN_URL=http://ai-admin-service:8800
      - AUTH_MODE=keycloak
      - KEYCLOAK_URL=http://host.docker.internal:8080
      - KEYCLOAK_REALM=abc-bank
      - KEYCLOAK_ADMIN_CLIENT_ID=ai-assistant-admin
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [ai-admin-service, keycloak]
  ai-assistant-api:
    build: { context: ., dockerfile: services/ai-assistant-api/Dockerfile }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      - AUTH_MODE=keycloak
      - KEYCLOAK_URL=http://host.docker.internal:8080
      - KEYCLOAK_REALM=abc-bank
      - KEYCLOAK_CLIENT_ID=ai-assistant-web
      - INGEST_ON_START=true
      - SAMPLE_DOCS=/corpus
      - LLM_CONFIG_PATH=/runtime/llm_config.json
      - INDEX_PATH=/kb/index.json
    volumes:
      - "./services/ai-knowledge-service/ingestion/sample_docs:/corpus:ro"
      - "llmcfg:/runtime"
      - "kbindex:/kb"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [ai-orchestrator, ai-conversation-service, redis, keycloak]
  ai-orchestrator:
    build: { context: ., dockerfile: services/ai-orchestrator/Dockerfile }
    expose: ["8100"]
    env_file: .env
    environment:
      - LLM_CONFIG_PATH=/runtime/llm_config.json
      - INDEX_PATH=/kb/index.json
    volumes:
      - "llmcfg:/runtime"
      - "kbindex:/kb"
    depends_on: [ai-knowledge-retrieval, ai-tool-service, ai-conversation-service, ai-model-gateway]
  ai-knowledge-retrieval:
    build: { context: ., dockerfile: services/ai-knowledge-service/retrieval/Dockerfile }
    expose: ["8200"]
    env_file: .env
    environment: ["INDEX_PATH=/kb/index.json"]
    volumes: ["kbindex:/kb"]
  ai-knowledge-ingest:
    build: { context: ., dockerfile: services/ai-knowledge-service/ingestion/Dockerfile }
    expose: ["8400"]
    env_file: .env
    environment: ["INDEX_PATH=/kb/index.json"]
    volumes: ["kbindex:/kb"]
    depends_on: [postgres]
  ai-tool-service:
    build: { context: ., dockerfile: services/ai-tool-service/Dockerfile }
    expose: ["8300"]
    env_file: .env
  ai-conversation-service:
    build: { context: ., dockerfile: services/ai-conversation-service/Dockerfile }
    expose: ["8600"]
    env_file: .env
    depends_on: [redis, postgres]
  ai-model-gateway:
    build: { context: ., dockerfile: services/ai-model-gateway/Dockerfile }
    expose: ["8700"]
    env_file: .env
    environment:
      - LLM_CONFIG_PATH=/runtime/llm_config.json
    volumes: ["llmcfg:/runtime"]
    depends_on: [redis]
  ai-admin-service:
    build: { context: ., dockerfile: services/ai-admin-service/Dockerfile }
    ports: ["8800:8800"]
    env_file: .env
    environment:
      - AUTH_MODE=keycloak
      - KEYCLOAK_URL=http://host.docker.internal:8080
      - KEYCLOAK_REALM=abc-bank
      - KEYCLOAK_CLIENT_ID=ai-assistant-admin
      - LLM_CONFIG_PATH=/runtime/llm_config.json
      - INDEX_PATH=/kb/index.json
    volumes:
      - "llmcfg:/runtime"
      - "kbindex:/kb"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [ai-knowledge-ingest, postgres, keycloak]
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    ports: ["8080:8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Stable issuer shared by browser (SSO redirect) and containers (token/JWKS) — see README.
      KC_HOSTNAME_URL: http://host.docker.internal:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - "./infra/keycloak:/opt/keycloak/data/import:ro"
  redis:
    image: redis:7
    expose: ["6379"]
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    expose: ["5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
  llmcfg:
  kbindex:
