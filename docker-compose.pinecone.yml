# ============================================================================
# Pinecone: use MANAGED Pinecone cloud (the local emulator is retired).
#
# NOTE: Pinecone Local (the in-memory emulator, `pinecone-local`) reached
# end-of-life on 2026-10-07 and no longer works with the current Python SDK
# (create_index fails with HTTP 422). This override therefore no longer starts
# an emulator — there is nothing to start.
#
# To use REAL Pinecone (free serverless tier is plenty for this corpus):
#   1. Create a project + API key at https://app.pinecone.io
#   2. In .env set:
#        PINECONE_API_KEY=<your real key>     # NOT "pclocal"
#        PINECONE_INDEX=ai-assistant
#        PINECONE_CLOUD=aws                    # or your provider
#        PINECONE_REGION=us-east-1             # a region your plan allows
#        # leave PINECONE_HOST blank (that was only for the dead emulator)
#   3. Run the NORMAL stack — no override needed:
#        docker compose up --build
#
# The adapter (libs/rag/vectorstore_pinecone.py) creates the serverless index
# lazily on first upsert using the live embedding dimension (384 for the local
# bge-small embedder), so vectors are embedded ONCE at ingest and persisted in
# Pinecone. With PINECONE_API_KEY blank the stack uses the in-memory index.
# docs/04 §3, ADR-002.
# ============================================================================
name: ai-assistant
